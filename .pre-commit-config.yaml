repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.1
    hooks:
      - id: sqlfluff-lint
        additional_dependencies:
          - dbt-postgres>=1.8,<2
          - sqlfluff-templater-dbt>=3,<4
        args:
          - --config=.sqlfluff
        files: ^models/.*\.sql$
