name: skills_taxonomy
version: "0.1.0"
config-version: 2
profile: skills_taxonomy

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

models:
  skills_taxonomy:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  skills_taxonomy:
    +schema: seeds
    skills:
      +column_types:
        skill_id: text
        name: text
        description: text
        skill_type: text
        lifecycle_state: text
        created_at: timestamp
        updated_at: timestamp
    skill_synonyms:
      +column_types:
        skill_id: text
        synonym: text
        is_preferred: boolean
        source: text
    skill_redirects:
      +column_types:
        from_skill_id: text
        to_skill_id: text
        reason: text
        created_at: timestamp
    skill_implies:
      +column_types:
        from_skill_id: text
        to_skill_id: text
        strength: "numeric(3,2)"
        source: text
        lifecycle_state: text
        created_at: timestamp
        updated_at: timestamp
    capabilities:
      +column_types:
        capability_id: text
        name: text
        description: text
        group_name: text
        lifecycle_state: text
        created_at: timestamp
        updated_at: timestamp
    capability_skills:
      +column_types:
        capability_id: text
        skill_id: text
        weight: "numeric(3,2)"
        source: text
    skill_sources:
      +column_types:
        skill_id: text
        source: text
        source_id: text
        source_uri: text
        imported_at: timestamp
    capability_sources:
      +column_types:
        capability_id: text
        source: text
        source_id: text
        imported_at: timestamp
    seed_tenant_skill_visibility:
      +column_types:
        tenant_id: text
        skill_id: text
        visibility_state: text
        updated_at: timestamp
        updated_by: text
    seed_tenant_capability_visibility:
      +column_types:
        tenant_id: text
        capability_id: text
        visibility_state: text
        updated_at: timestamp
        updated_by: text
