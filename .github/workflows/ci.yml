name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt-and-sqlfluff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Prepare dbt profile
        run: cp profiles.yml.example profiles.yml

      - name: Install dbt packages
        run: uv run dbt deps --profiles-dir .

      - name: Lint SQL models
        run: uv run sqlfluff lint models/

      - name: Compile dbt project
        run: uv run dbt compile --profiles-dir .
