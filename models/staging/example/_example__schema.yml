version: 2

models:
  - name: stg_example__skills
    description: "Cleaned skills from the example (Mind Management Institute) seed."
    columns:
      - name: skill_id
        description: "Stable internal skill identifier (slug)."
        tests:
          - not_null
          - unique
      - name: name
        description: "Canonical display name."
        tests:
          - not_null
      - name: description
        description: "Optional skill definition."
      - name: skill_type
        description: "hard or soft."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["hard", "soft"]
      - name: lifecycle_state
        description: "draft, published, deprecated, or suppressed."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["draft", "published", "deprecated", "suppressed"]
      - name: created_at
        description: "Row creation timestamp."
        tests:
          - not_null
      - name: updated_at
        description: "Row last-update timestamp."
        tests:
          - not_null

  - name: stg_example__skill_synonyms
    description: "Cleaned skill synonyms from the example seed."
    columns:
      - name: skill_id
        description: "Foreign key to skills."
        tests:
          - not_null
      - name: synonym
        description: "Normalised synonym text (lowercase/trimmed)."
        tests:
          - not_null
      - name: is_preferred
        description: "True for the canonical display synonym."
        tests:
          - not_null
      - name: source
        description: "Data provenance (manual, lightcast, esco, etc.)."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - skill_id
              - synonym

  - name: stg_example__skill_redirects
    description: "Cleaned skill redirects from the example seed."
    columns:
      - name: from_skill_id
        description: "Old/duplicate skill ID being redirected."
        tests:
          - not_null
          - unique
      - name: to_skill_id
        description: "Canonical skill ID target."
        tests:
          - not_null
      - name: reason
        description: "Redirect reason: duplicate, renamed, merged, or standardised."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["duplicate", "renamed", "merged", "standardised"]
      - name: created_at
        description: "When the redirect was created."
        tests:
          - not_null

  - name: stg_example__skill_implies
    description: "Cleaned skill implication edges from the example seed."
    columns:
      - name: from_skill_id
        description: "Observed skill that implies another."
        tests:
          - not_null
      - name: to_skill_id
        description: "Implied foundational skill."
        tests:
          - not_null
      - name: strength
        description: "Confidence weight 0.00-1.00."
        tests:
          - not_null
      - name: source
        description: "Data provenance."
        tests:
          - not_null
      - name: lifecycle_state
        description: "Edge lifecycle: published, deprecated, or suppressed."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["published", "deprecated", "suppressed"]
      - name: created_at
        description: "Row creation timestamp."
        tests:
          - not_null
      - name: updated_at
        description: "Row last-update timestamp."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - from_skill_id
              - to_skill_id

  - name: stg_example__capabilities
    description: "Cleaned capabilities from the example seed."
    columns:
      - name: capability_id
        description: "Stable internal capability identifier."
        tests:
          - not_null
          - unique
      - name: name
        description: "Display name."
        tests:
          - not_null
      - name: description
        description: "Optional capability definition."
      - name: group_name
        description: "Optional grouping label for navigation/reporting."
      - name: lifecycle_state
        description: "draft, published, deprecated, or suppressed."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["draft", "published", "deprecated", "suppressed"]
      - name: created_at
        description: "Row creation timestamp."
        tests:
          - not_null
      - name: updated_at
        description: "Row last-update timestamp."
        tests:
          - not_null

  - name: stg_example__capability_skills
    description: "Cleaned capability-skill weight mappings from the example seed."
    columns:
      - name: capability_id
        description: "Foreign key to capabilities."
        tests:
          - not_null
      - name: skill_id
        description: "Foreign key to skills."
        tests:
          - not_null
      - name: weight
        description: "Relevance weight 0.00-1.00."
        tests:
          - not_null
      - name: source
        description: "Data provenance."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - capability_id
              - skill_id

  - name: stg_example__skill_sources
    description: "Cleaned skill source traceability from the example seed."
    columns:
      - name: skill_id
        description: "Foreign key to skills."
        tests:
          - not_null
      - name: source
        description: "Source system name (manual, lightcast, esco, etc.)."
        tests:
          - not_null
      - name: source_id
        description: "External identifier in the source system."
        tests:
          - not_null
      - name: source_uri
        description: "External URI if available."
      - name: imported_at
        description: "When this record was imported."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - skill_id
              - source

  - name: stg_example__capability_sources
    description: "Cleaned capability source traceability from the example seed."
    columns:
      - name: capability_id
        description: "Foreign key to capabilities."
        tests:
          - not_null
      - name: source
        description: "Source system name."
        tests:
          - not_null
      - name: source_id
        description: "External identifier in the source system."
        tests:
          - not_null
      - name: imported_at
        description: "When this record was imported."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - capability_id
              - source

  - name: stg_example__tenant_skill_visibility
    description: "Cleaned tenant skill visibility overrides from the example seed."
    columns:
      - name: tenant_id
        description: "Tenant identifier."
        tests:
          - not_null
      - name: skill_id
        description: "Foreign key to skills."
        tests:
          - not_null
      - name: visibility_state
        description: "enabled or hidden."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["enabled", "hidden"]
      - name: updated_at
        description: "When this override was last updated."
        tests:
          - not_null
      - name: updated_by
        description: "Optional actor ID or email."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tenant_id
              - skill_id

  - name: stg_example__tenant_capability_visibility
    description: "Cleaned tenant capability visibility overrides from the example seed."
    columns:
      - name: tenant_id
        description: "Tenant identifier."
        tests:
          - not_null
      - name: capability_id
        description: "Foreign key to capabilities."
        tests:
          - not_null
      - name: visibility_state
        description: "enabled or hidden."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["enabled", "hidden"]
      - name: updated_at
        description: "When this override was last updated."
        tests:
          - not_null
      - name: updated_by
        description: "Optional actor ID or email."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tenant_id
              - capability_id
