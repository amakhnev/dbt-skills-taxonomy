version: 2

models:
  - name: int_skills_merged
    description: "Union of all source-specific skills staging models, deduplicated by skill_id with source priority."
    columns:
      - name: skill_id
        description: "Stable internal skill identifier (slug)."
        tests:
          - not_null
          - unique
      - name: name
        description: "Canonical display name."
        tests:
          - not_null
      - name: description
        description: "Optional skill definition."
      - name: skill_type
        description: "hard or soft."
        tests:
          - not_null
      - name: lifecycle_state
        description: "draft, published, deprecated, or suppressed."
        tests:
          - not_null
      - name: created_at
        description: "Row creation timestamp."
        tests:
          - not_null
      - name: updated_at
        description: "Row last-update timestamp."
        tests:
          - not_null

  - name: int_skill_synonyms_merged
    description: "Union of all source-specific skill synonyms."
    columns:
      - name: skill_id
        description: "Foreign key to skills."
        tests:
          - not_null
      - name: synonym
        description: "Normalised synonym text (lowercase/trimmed)."
        tests:
          - not_null
      - name: is_preferred
        description: "True for the canonical display synonym."
        tests:
          - not_null
      - name: source
        description: "Data provenance."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - skill_id
              - synonym

  - name: int_skill_redirects_merged
    description: "Union of all source-specific skill redirects."
    columns:
      - name: from_skill_id
        description: "Old/duplicate skill ID being redirected."
        tests:
          - not_null
          - unique
      - name: to_skill_id
        description: "Canonical skill ID target."
        tests:
          - not_null
      - name: reason
        description: "Redirect reason."
        tests:
          - not_null
      - name: created_at
        description: "When the redirect was created."
        tests:
          - not_null

  - name: int_skill_implies_merged
    description: "Union of all source-specific skill implication edges."
    columns:
      - name: from_skill_id
        description: "Observed skill that implies another."
        tests:
          - not_null
      - name: to_skill_id
        description: "Implied foundational skill."
        tests:
          - not_null
      - name: strength
        description: "Confidence weight 0.00-1.00."
        tests:
          - not_null
      - name: source
        description: "Data provenance."
        tests:
          - not_null
      - name: lifecycle_state
        description: "Edge lifecycle state."
        tests:
          - not_null
      - name: created_at
        description: "Row creation timestamp."
        tests:
          - not_null
      - name: updated_at
        description: "Row last-update timestamp."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - from_skill_id
              - to_skill_id

  - name: int_capabilities_merged
    description: "Union of all source-specific capabilities."
    columns:
      - name: capability_id
        description: "Stable internal capability identifier."
        tests:
          - not_null
          - unique
      - name: name
        description: "Display name."
        tests:
          - not_null
      - name: description
        description: "Optional capability definition."
      - name: group_name
        description: "Optional grouping label."
      - name: lifecycle_state
        description: "draft, published, deprecated, or suppressed."
        tests:
          - not_null
      - name: created_at
        description: "Row creation timestamp."
        tests:
          - not_null
      - name: updated_at
        description: "Row last-update timestamp."
        tests:
          - not_null

  - name: int_capability_skills_merged
    description: "Union of all source-specific capability-skill weight mappings."
    columns:
      - name: capability_id
        description: "Foreign key to capabilities."
        tests:
          - not_null
      - name: skill_id
        description: "Foreign key to skills."
        tests:
          - not_null
      - name: weight
        description: "Relevance weight 0.00-1.00."
        tests:
          - not_null
      - name: source
        description: "Data provenance."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - capability_id
              - skill_id

  - name: int_skill_sources_merged
    description: "Union of all source-specific skill source traceability."
    columns:
      - name: skill_id
        description: "Foreign key to skills."
        tests:
          - not_null
      - name: source
        description: "Source system name."
        tests:
          - not_null
      - name: source_id
        description: "External identifier in the source system."
        tests:
          - not_null
      - name: source_uri
        description: "External URI if available."
      - name: imported_at
        description: "When this record was imported."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - skill_id
              - source

  - name: int_capability_sources_merged
    description: "Union of all source-specific capability source traceability."
    columns:
      - name: capability_id
        description: "Foreign key to capabilities."
        tests:
          - not_null
      - name: source
        description: "Source system name."
        tests:
          - not_null
      - name: source_id
        description: "External identifier in the source system."
        tests:
          - not_null
      - name: imported_at
        description: "When this record was imported."
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - capability_id
              - source

  - name: int_tenant_skill_visibility_merged
    description: "Union of all source-specific tenant skill visibility overrides."
    columns:
      - name: tenant_id
        description: "Tenant identifier."
        tests:
          - not_null
      - name: skill_id
        description: "Foreign key to skills."
        tests:
          - not_null
      - name: visibility_state
        description: "enabled or hidden."
        tests:
          - not_null
      - name: updated_at
        description: "When this override was last updated."
        tests:
          - not_null
      - name: updated_by
        description: "Optional actor ID or email."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tenant_id
              - skill_id

  - name: int_tenant_capability_visibility_merged
    description: "Union of all source-specific tenant capability visibility overrides."
    columns:
      - name: tenant_id
        description: "Tenant identifier."
        tests:
          - not_null
      - name: capability_id
        description: "Foreign key to capabilities."
        tests:
          - not_null
      - name: visibility_state
        description: "enabled or hidden."
        tests:
          - not_null
      - name: updated_at
        description: "When this override was last updated."
        tests:
          - not_null
      - name: updated_by
        description: "Optional actor ID or email."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tenant_id
              - capability_id
